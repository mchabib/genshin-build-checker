<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genshin Build Checker</title>
<style>
  :root {
    --bg: #0e0e12; --panel: #17171f; --panel2: #1d1d27; --line: #2a2a36;
    --text: #e7e7ea; --dim: #8b8b99; --dimmer: #5f5f6e;
    --pass: #34d399; --info: #60a5fa; --warn: #fbbf24; --fail: #f87171; --skip: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }

  form { display: flex; gap: 8px; margin-bottom: 10px; }
  input, button, select {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 10px 12px;
  }
  input { flex: 1; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: #4b5563; }
  button { cursor: pointer; background: #0284c7; border-color: #0284c7; font-weight: 600; }
  button:hover:not(:disabled) { background: #0369a1; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--dimmer); font-size: 12px; margin-bottom: 18px; }

  .msg { border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
  .msg.err { border: 1px solid #7f1d1d; background: #7f1d1d22; color: #fca5a5; }
  .msg.load { border: 1px solid var(--line); background: var(--panel); color: var(--dim); }

  .player { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .card {
    text-align: left; padding: 10px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-weight: 400; display: block; width: 100%;
  }
  .card:hover { border-color: #4b5563; background: var(--panel2); }
  .card.on { border-color: #0ea5e9; background: #0ea5e922; }
  .card:disabled { opacity: .4; cursor: default; }
  .card .nm { font-weight: 600; }
  .card .mt { color: var(--dimmer); font-size: 12px; margin-top: 2px; }

  .result { margin-top: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 18px; }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .grade {
    width: 54px; height: 54px; border-radius: 10px; display: grid; place-items: center;
    font-size: 24px; font-weight: 700; color: #fff; flex: none;
  }
  .g-S { background: #d946ef; } .g-A { background: #10b981; } .g-B { background: #0ea5e9; }
  .g-C { background: #f59e0b; } .g-D { background: #ef4444; }
  .head .t1 { font-size: 17px; font-weight: 600; }
  .head .t2 { color: var(--dim); font-size: 13px; margin-top: 2px; }

  .meta { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .meta div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .meta .k { color: var(--dimmer); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .meta .v { font-weight: 600; margin-top: 2px; }

  .checks { margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
  .chk { border-left: 3px solid var(--skip); border-radius: 6px; background: var(--panel2); padding: 9px 12px; }
  .chk .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .chk .lbl { font-weight: 600; }
  .chk .st { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .chk .dt { color: var(--dim); font-size: 13px; margin-top: 3px; white-space: pre-wrap; }
  .s-pass { border-left-color: var(--pass); } .s-pass .st { color: var(--pass); }
  .s-info { border-left-color: var(--info); } .s-info .st { color: var(--info); }
  .s-warn { border-left-color: var(--warn); } .s-warn .st { color: var(--warn); }
  .s-fail { border-left-color: var(--fail); } .s-fail .st { color: var(--fail); }
  .s-skip { border-left-color: var(--skip); } .s-skip .st { color: var(--skip); }

  .recs { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); padding: 12px 14px; }
  .bench { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); padding: 12px 14px; }
  .bench .bar { position: relative; height: 18px; border-radius: 9px; background: var(--line); margin: 8px 0 4px; overflow: hidden; }
  .bench .fill { height: 100%; border-radius: 9px; }
  .bench .pct { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 600; line-height: 18px; }
  .bench table { margin-top: 8px; font-size: 12.5px; }
  .recs h3 { margin: 0 0 6px; font-size: 13px; }
  .recs ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .recs li { margin-bottom: 4px; }

  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dimmer); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
  td.sub { color: var(--dim); }
  .foot { margin-top: 16px; color: var(--dimmer); font-size: 12px; }
  a { color: #38bdf8; }

  /* Fase 2: damage */
  .dmg { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .dmg h2 { font-size: 15px; margin: 0 0 10px; }
  .ctl { display: grid; grid-template-columns: 2fr 1.2fr .8fr .8fr auto; gap: 8px; align-items: center; }
  .ctl label { color: var(--dimmer); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 3px; }
  .ctl input, .ctl select { width: 100%; padding: 8px 10px; }
  .ctl .chk { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; white-space: nowrap; padding-top: 16px; }
  .ctl .chk input { width: auto; }
  @media (max-width: 640px) { .ctl { grid-template-columns: 1fr 1fr; } }
  .tbl-wrap { overflow-x: auto; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num { text-align: right; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); margin-right: 4px; }
  .verdict { margin-top: 12px; border-left: 3px solid #a78bfa; background: var(--panel2); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
  .verdict .h { color: #a78bfa; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .verdict ul { margin: 6px 0 0; padding-left: 18px; color: var(--dim); }
  .warns { margin-top: 10px; color: var(--warn); font-size: 12px; }
  .stats-line { color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  button.sm { padding: 6px 10px; font-size: 12px; background: var(--panel2); border-color: var(--line); color: var(--text); font-weight: 500; }
  button.sm:hover:not(:disabled) { background: #2a2a36; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Genshin Build Checker</h1>
  <div class="sub">Cek build karakter vs benchmark <a href="https://keqingmains.com/" target="_blank" rel="noreferrer">KQM</a>.</div>

  <form id="f">
    <input id="uid" inputmode="numeric" placeholder="UID Genshin (9–10 digit)" autocomplete="off" />
    <button id="go" type="submit">Fetch</button>
  </form>
  <div class="hint">
    Pin karakter yang mau dicek di <b>Character Showcase</b> in-game, dan aktifkan
    <b>Show Character Details</b> di privasi. Data = snapshot terakhir profil di-refresh, cooldown ±60 detik per UID.
  </div>

  <div id="msg"></div>
  <div id="player" class="player" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const STATUS = { pass:"OK", info:"Info", warn:"Perlu dilihat", fail:"Kurang", skip:"N/A" };

let uid = "", chars = [], selected = null;

function msg(text, kind) {
  $("msg").innerHTML = text ? `<div class="msg ${kind || "load"}">${esc(text)}</div>` : "";
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = $("uid").value.trim();
  if (!/^[1-9]\d{8,9}$/.test(v)) return msg("UID harus 9–10 digit.", "err");
  uid = v;
  $("go").disabled = true;
  $("grid").innerHTML = ""; $("out").innerHTML = ""; $("player").hidden = true;
  msg("Mengambil data dari Enka…");
  try {
    const r = await fetch(`/api/enka/${uid}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || `HTTP ${r.status}`);
    chars = d.characters || [];
    $("player").hidden = false;
    $("player").textContent =
      `${d.player.nickname ?? "?"} · AR ${d.player.level ?? "?"} · ${d.meta.cached ? "dari cache" : "fresh"} · ` +
      `${d.meta.guideCount}/${d.meta.totalCount} karakter punya guide`;
    renderGrid();
    msg("");
    const first = chars.find(c => c.checkable);
    if (first) select(first.key);
  } catch (err) {
    msg(err.message, "err");
  } finally {
    $("go").disabled = false;
  }
});

function renderGrid() {
  $("grid").innerHTML = chars.map(c => {
    const sets = (c.sets || []).map(s => `${s.count}pc ${s.name}`).join(" + ") || "—";
    const note = !c.supported ? "nama tak dikenal"
      : !c.checkable ? "belum ada guide"
      : `Lv ${c.level ?? "?"} · C${c.constellation}`;
    return `<button class="card${selected === c.key ? " on" : ""}" data-k="${esc(c.key)}"
              ${c.checkable ? "" : "disabled"}>
        <div class="nm">${esc(c.name)}</div>
        <div class="mt">${esc(note)}</div>
        <div class="mt">${esc(sets)}</div>
      </button>`;
  }).join("");
  $("grid").querySelectorAll(".card[data-k]").forEach(b =>
    b.addEventListener("click", () => select(b.dataset.k)));
}

async function select(key) {
  selected = key;
  renderGrid();
  $("out").innerHTML = `<div class="msg load">Mengecek…</div>`;
  try {
    const r = await fetch(`/api/assess/${uid}/${encodeURIComponent(key)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || `HTTP ${r.status}`);
    render(d);
  } catch (err) {
    $("out").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  }
}

function render(b) {
  const R = b.deterministic, ch = b.character, w = b.weapon, s = b.stats;
  const talent = ch.talents ? `${ch.talents.normal}/${ch.talents.skill}/${ch.talents.burst}` : "—";

  const meta = [
    ["Senjata", w ? `${w.name ?? "?"} R${w.refinement}` : "—"],
    ["Constellation", "C" + ch.constellation],
    ["Talent N/S/B", talent],
    ["Set", (b.activeSets || []).map(x => `${x.count}pc ${x.name}`).join(" + ") || "—"],
  ];
  const statRow = [
    ["CRIT Rate", s.critRate + "%"], ["CRIT DMG", s.critDmg + "%"],
    ["ER", s.energyRecharge + "%"], ["EM", s.elementalMastery],
    ["HP", b.finalStats.hp], ["ATK", b.finalStats.atk],
  ];

  $("out").innerHTML = `
  <div class="result">
    <div class="head">
      <div class="grade g-${esc(R.grade)}">${esc(R.grade)}</div>
      <div>
        <div class="t1">${esc(ch.name)} — ${R.passed ? "Lolos benchmark" : "Belum lolos"}</div>
        <div class="t2">skor ${R.score}/100${R.buildName ? " · build: " + esc(R.buildName) : ""}${R.erLabel ? " · ER: " + esc(R.erLabel) : ""}</div>
      </div>
    </div>

    <div class="meta">
      ${meta.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}
    </div>
    <div class="meta">
      ${statRow.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}
    </div>

    <div class="checks">
      ${R.checks.map(c => `
        <div class="chk s-${esc(c.status)}">
          <div class="top"><span class="lbl">${esc(c.label)}</span><span class="st">${esc(STATUS[c.status] || c.status)}</span></div>
          <div class="dt">${esc(c.detail)}</div>
        </div>`).join("")}
    </div>

    ${b.benchmark ? (() => {
      const B = b.benchmark, pct = Math.round(B.ratio * 100), col = B.status === "pass" ? "#2e9e5b" : B.status === "warn" ? "#d98c1f" : "#d64545";
      return `<div class="bench">
        <div class="top"><b>Benchmark vs standar KQMS</b> <span class="sub">artifact diganti standar, sisanya sama · rotasi ${esc(B.rotation)}</span></div>
        <div class="bar"><div class="fill" style="width:${Math.min(100, pct)}%;background:${col}"></div><span class="pct">${pct}%</span></div>
        <div class="sub">kamu ${n0(B.userTotal)} vs acuan ${n0(B.referenceTotal)} per rotasi</div>
        <div class="tbl-wrap"><table>
          <tr><th>stat</th><th class="num">kamu</th><th class="num">acuan</th><th class="num">selisih</th></tr>
          ${B.deltas.map(d => `<tr><td>${esc(d.stat)}</td><td class="num">${d.user}</td><td class="num">${d.reference}</td><td class="num" style="color:${d.delta < 0 ? "#d64545" : d.delta > 0 ? "#2e9e5b" : "inherit"}">${d.delta > 0 ? "+" : ""}${d.delta}</td></tr>`).join("")}
        </table></div>
      </div>`;
    })() : ""}

    ${R.recommendations?.length ? `
      <div class="recs"><h3>Rekomendasi</h3>
        <ul>${R.recommendations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>` : ""}

    <details>
      <summary>Detail artifact (${b.artifacts.length})</summary>
      <table>
        <tr><th>Slot</th><th>Set</th><th>Main</th><th>Substat</th></tr>
        ${b.artifacts.map(a => `<tr>
          <td>${esc(a.slot)} <span class="sub">+${a.level}</span></td>
          <td class="sub">${esc(a.setName ?? "?")}</td>
          <td>${esc(a.mainStat.stat)} ${a.mainStat.value}</td>
          <td class="sub">${a.substats.map(x => esc(x.stat) + " " + x.value).join(", ")}</td>
        </tr>`).join("")}
      </table>
    </details>

    <div class="ctl" style="grid-template-columns: 1.4fr 1fr 1fr; margin-top: 14px">
      <div><label>Model LLM</label>
        <select id="l-model">
          <option value="">default (.env)</option>
          <option value="deepseek-flash">deepseek-flash (murah)</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro (pintar)</option>
        </select></div>
      <div><label>Thinking</label>
        <select id="l-think"><option value="">default</option><option value="on">on</option><option value="off">off</option></select></div>
      <div><label>Reasoning effort</label>
        <select id="l-effort"><option value="">default</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></div>
    </div>
    <div id="llm-assess" style="margin-top:10px">
      <button class="sm" id="btn-llm-assess" type="button">Minta verdict LLM</button>
    </div>

    <div class="foot">
      Benchmark: <a href="${esc(b.guide.sourceUrl)}" target="_blank" rel="noreferrer">KQM guide</a>
      ${b.guide.guideUpdated ? " · update " + esc(b.guide.guideUpdated.slice(0, 10)) : ""}
      ${b.teammates?.length ? " · teammates: " + esc(b.teammates.join(", ")) : ""}
    </div>

    <div class="dmg">
      <h2>Damage (Fase 2)</h2>
      <div class="ctl">
        <div><label>Tim (pisah koma, kosong = LLM pilih)</label><input id="d-team" placeholder="furina, kazuha, zhongli" /></div>
        <div><label>Reaksi</label>
          <select id="d-react">
            <option value="">auto / tanpa</option>
            <option>vaporize</option><option>melt</option><option>aggravate</option><option>spread</option>
            <option>overloaded</option><option>electroCharged</option><option>superconduct</option><option>swirl</option>
            <option>burning</option><option>bloom</option><option>hyperbloom</option><option>burgeon</option><option>shattered</option>
          </select></div>
        <div><label>Lv musuh</label><input id="d-lvl" type="number" value="90" min="1" max="100" /></div>
        <div><label>RES %</label><input id="d-res" type="number" value="10" min="-100" max="100" /></div>
        <div class="chk">
          <input id="d-assume" type="checkbox" checked /><label for="d-assume" style="margin:0;text-transform:none;font-size:13px;color:var(--dim)" title="anggap buff kondisional aktif (stack max, dsb)">asumsi</label>
          <input id="d-llm" type="checkbox" /><label for="d-llm" style="margin:0;text-transform:none;font-size:13px;color:var(--dim)" title="pakai LLM buat milih tim/buff/reaksi/rotasi">LLM</label>
          <button class="sm" id="d-go" type="button">Hitung</button></div>
      </div>
      <div id="d-out"></div>
    </div>
  </div>`;
  $("btn-llm-assess").addEventListener("click", () => llmAssess(b.character.key));
  $("d-go").addEventListener("click", () => damage(b.character.key));
  $("out").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function llmParams(q) {
  const m = $("l-model")?.value, t = $("l-think")?.value, e = $("l-effort")?.value;
  if (m) q.set("model", m);
  if (t) q.set("thinking", t);
  if (e) q.set("effort", e);
  return q;
}

async function llmAssess(key) {
  const box = $("llm-assess");
  box.innerHTML = `<div class="msg load">Minta verdict ke LLM… (thinking bisa 20-60 detik)</div>`;
  try {
    const q = llmParams(new URLSearchParams({ llm: "1" }));
    const r = await fetch(`/api/assess/${uid}/${encodeURIComponent(key)}?${q}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || `HTTP ${r.status}`);
    const L = d.llm;
    if (!L || L.error) throw new Error(L?.error || "LLM nggak balas");
    box.innerHTML = `<div class="verdict">
      <div class="h">Verdict LLM${L.grade ? " · " + esc(L.grade) : ""} <span class="tag">${esc(L.model)}</span></div>
      <div>${esc(L.verdict)}</div>
      ${L.strengths?.length ? `<div style="margin-top:8px">🟢 Yang udah bagus</div><ul>${L.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${L.issues?.length ? `<div style="margin-top:8px">🔴 Yang perlu dibenerin</div><ul>${L.issues.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${L.priorities?.length ? `<div style="margin-top:8px">To-do</div><ol style="margin:6px 0 0;padding-left:18px;color:var(--dim)">${L.priorities.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
      ${L.overrides?.length ? `<div style="margin-top:8px">Override flag deterministik</div><ul>${L.overrides.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div>`;
  } catch (err) {
    box.innerHTML = `<div class="msg err">${esc(err.message)}</div><button class="sm" type="button" onclick="llmAssess('${esc(key)}')">Coba lagi</button>`;
  }
}

const n0 = (x) => Math.round(x).toLocaleString("en-US");

function dmgTable(title, t) {
  const rows = t.hits.map(h => `<tr>
      <td class="sub">${esc(h.id)}</td>
      <td>${h.hitCount > 1 ? `×${h.hitCount} ` : ""}${esc(h.label)}<div class="sub" style="font-size:11px">${esc(h.multiplierText)}</div></td>
      <td class="sub">${esc(h.element)}${h.reaction ? ` <span class="tag">${esc(h.reaction)}</span>` : ""}</td>
      <td class="num">${n0(h.nonCrit)}</td><td class="num">${n0(h.crit)}</td><td class="num"><b>${n0(h.avg)}</b></td>
    </tr>`).join("");
  const tr = (t.transformative || []).map(x => `<tr>
      <td class="sub">react:${esc(x.reaction)}</td><td>transformative (per proc)</td><td class="sub">${esc(x.element)}</td>
      <td></td><td></td><td class="num"><b>${n0(x.dmg)}</b></td></tr>`).join("");
  const s = t.stats;
  return `<div class="stats-line"><b>${esc(title)}</b> — ATK ${n0(s.atk)} · HP ${n0(s.hp)} · DEF ${n0(s.def)} · EM ${n0(s.em)} · CR ${s.critRate.toFixed(1)}% · CD ${s.critDmg.toFixed(1)}%</div>
    <div class="tbl-wrap"><table>
      <tr><th>id</th><th>hit</th><th>elemen</th><th class="num">non-crit</th><th class="num">crit</th><th class="num">avg</th></tr>
      ${rows}${tr}
    </table></div>`;
}

async function damage(key) {
  const out = $("d-out");
  out.innerHTML = `<div class="msg load">Menghitung…${$("d-llm").checked ? " (LLM dengan thinking bisa 20-90 detik)" : " (offline, tanpa AI)"}</div>`;
  $("d-go").disabled = true;
  try {
    const q = new URLSearchParams();
    const team = $("d-team").value.trim();
    if (team) q.set("team", team);
    if ($("d-react").value) q.set("reaction", $("d-react").value);
    q.set("enemyLvl", $("d-lvl").value || "90");
    q.set("enemyRes", $("d-res").value || "10");
    q.set("llm", $("d-llm").checked ? "1" : "0");
    if (!$("d-assume").checked) q.set("noAssume", "1");
    llmParams(q);
    const r = await fetch(`/api/damage/${uid}/${encodeURIComponent(key)}?${q}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || `HTTP ${r.status}`);

    const extra = d.modifiers.filter(m => m.origin !== "self");
    const mods = d.modifiers.map(m => {
      const { origin, source, note, scope, hitIds, id, ...vals } = m;
      const v = Object.entries(vals).filter(([, x]) => x != null)
        .map(([k, x]) => `${k}=${typeof x === "object" ? JSON.stringify(x) : x}`).join(" ");
      const sc = hitIds?.length ? hitIds.join("/") : Array.isArray(scope) ? scope.join("/") : scope;
      return `<li><span class="tag">${esc(origin)}</span><b>${esc(source)}</b> <span class="sub">(${esc(sc)})</span> ${esc(v)}${note ? ` <span class="sub">— ${esc(note)}</span>` : ""}</li>`;
    }).join("");
    const L = d.llm;
    const teamStr = d.team.members.length ? d.team.members.map(m => m.name).join(", ") + (d.team.reason ? ` (${d.team.reason})` : "") : "solo";
    const reacts = Object.entries(d.reactions || {}).filter(([, v]) => v).map(([k, v]) => `${k}=${v}`).join(", ");

    out.innerHTML = `
      <div class="stats-line"><span class="tag">${d.mode === "llm" ? "mode LLM" : "mode OFFLINE"}</span>${d.character.role ? `<span class="tag">role ${esc(d.character.role)}</span>` : ""}${d.character.hasModule ? "" : '<span class="tag">belum ada modul Buffs</span>'}
        Musuh Lv ${d.enemy.level}, RES ${Math.round(d.enemy.res.pyro * 100)}% · tim: ${esc(teamStr)} · NA/CA/plunge: ${esc(d.character.naElements.na)}/${esc(d.character.naElements.ca)}/${esc(d.character.naElements.plunge)}</div>
      ${reacts || d.reactionReason ? `<div class="stats-line">Reaksi: ${esc(reacts || "-")}${d.reactionReason ? ` <span class="sub">(${esc(d.reactionReason)})</span>` : ""}</div>` : ""}
      ${dmgTable("Baseline (self-buff pasti aktif)", d.baseline)}
      ${extra.length ? dmgTable("Dengan buff tim / asumsi kondisional", d.buffed) : ""}
      ${d.modifiers.length ? `<details open><summary>Modifier aktif (${d.modifiers.length})</summary><ul style="margin:6px 0 0;padding-left:18px;font-size:12.5px">${mods}</ul></details>` : ""}
      ${d.rotation ? `<div class="stats-line"><b>Rotasi (${esc(d.rotation.source)}): ${esc(d.rotation.label)}</b>${d.rotation.note ? ` <span class="sub">— ${esc(d.rotation.note)}</span>` : ""}</div><div class="tbl-wrap"><table>
          <tr><th>hit</th><th class="num">×</th><th class="num">avg</th><th class="num">subtotal</th></tr>
          ${d.rotation.rows.map(x => `<tr><td>${esc(x.label)} <span class="sub">${esc(x.id)}</span></td><td class="num">${x.count}</td><td class="num">${n0(x.avg)}</td><td class="num">${n0(x.subtotal)}</td></tr>`).join("")}
          <tr><td><b>TOTAL</b>${d.rotation.timing?.duration ? ` <span class="sub">${d.rotation.timing.duration}s · DPS <b>${n0(d.rotation.timing.dps)}</b> (${d.rotation.timing.source === "notation" ? "durasi dari notasi" : d.rotation.timing.source === "module" ? "durasi modul" : "durasi manual"})</span>` : ""}</td><td></td><td></td><td class="num"><b>${n0(d.rotation.total)}</b></td></tr>
        </table></div>` : ""}
      ${L ? (L.used ? `<div class="verdict">
          <div class="h">LLM <span class="tag">${esc(L.model)}</span>${L.cached ? '<span class="tag">cache</span>' : ""}${L.usage?.total_tokens ? `<span class="tag">${L.usage.total_tokens} token${L.usage.completion_tokens_details?.reasoning_tokens ? ` (${L.usage.completion_tokens_details.reasoning_tokens} reasoning)` : ""}</span>` : ""}</div>
          ${d.team.source === "llm" && L.teamReason ? `<div class="sub">Tim: ${esc(L.teamReason)}</div>` : ""}
          ${L.verdict ? `<div style="margin-top:6px">${esc(L.verdict)}</div>` : ""}
          ${L.notes?.length ? `<ul>${L.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${L.warnings?.length ? `<div class="warns">${L.warnings.map(esc).join("<br>")}</div>` : ""}
        </div>` : `<div class="warns">LLM nggak dipakai: ${esc(L.error)}</div>`) : ""}
      ${d.warnings?.length ? `<div class="warns">${d.warnings.map(esc).join("<br>")}</div>` : ""}`;
  } catch (err) {
    out.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  } finally {
    $("d-go").disabled = false;
  }
}
</script>
</body>
</html>
